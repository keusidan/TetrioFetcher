name: Wiki

# Publish wiki content from the repository, without needing the RikkaHub
# workspace to keep a long-running process alive.
#
# The wiki is a separate git repository (`<owner>/<repo>.wiki.git`) that the
# REST API cannot reach, so the job clones it directly with a token.
#
# Updating the wiki:
#
#   * Edit any `wiki/*.md` file and push to `main` -> that page is mirrored.
#   * Delete the file -> the page is deleted from the wiki too.
#   * Actions -> Wiki -> Run workflow -> write a single page ad hoc.

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:
    inputs:
      page:
        description: "Page name to write (e.g. FAQ). Leave empty to only sync wiki/."
        required: false
        type: string
      content:
        description: "Full Markdown body for the page. Required when page is set."
        required: false
        type: string
      message:
        description: "Commit message."
        required: false
        type: string
        default: "docs(wiki): update from Actions"

# One sync at a time; a later run supersedes an earlier queued one.
concurrency:
  group: wiki-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish wiki pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Assemble pages to publish
        id: assemble
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PAT }}
          PAGE: ${{ inputs.page }}
          CONTENT: ${{ inputs.content }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wiki-pages
          : > /tmp/wiki-pages.manifest

          # 1. Mirror every committed wiki page, and remember the page names so
          #    deletions can be propagated below.
          if [ -d wiki ]; then
            while IFS= read -r -d '' file; do
              name="$(basename "$file" .md)"
              cp "$file" "/tmp/wiki-pages/$name.md"
              printf '%s\n' "$name" >> /tmp/wiki-pages.manifest
              echo "staged from repo: $name"
            done < <(find wiki -maxdepth 1 -type f -name '*.md' -print0)
          fi

          # 2. Write the ad-hoc page, if one was supplied.
          if [ -n "${PAGE:-}" ]; then
            if [ -z "${CONTENT:-}" ]; then
              echo "::error::Input 'page' was given but 'content' is empty."
              exit 1
            fi
            if ! printf '%s' "$PAGE" | grep -Eq '^[A-Za-z0-9._() -]+$'; then
              echo "::error::Page name contains unsupported characters: $PAGE"
              exit 1
            fi
            printf '%s' "$CONTENT" > "/tmp/wiki-pages/${PAGE}.md"
            printf '%s\n' "$PAGE" >> /tmp/wiki-pages.manifest
            echo "staged from input: $PAGE"
          fi

          count="$(find /tmp/wiki-pages -type f -name '*.md' | wc -l)"
          echo "pages=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "Nothing to publish."
            exit 0
          fi

          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "::error::Repository secret WIKI_PAT is not set, so the wiki repository cannot be cloned. Add a classic PAT with the 'repo' scope as WIKI_PAT under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "message=${MESSAGE:-docs(wiki): update from Actions}" >> "$GITHUB_OUTPUT"

      - name: Clone the wiki repository
        if: steps.assemble.outputs.pages != '0'
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${WIKI_TOKEN}@github.com/".insteadOf "https://github.com/"
          if ! git clone --depth 1 \
              "https://github.com/${REPOSITORY}.wiki.git" /tmp/wiki 2>/tmp/clone.err; then
            echo "::error::Could not clone ${REPOSITORY}.wiki.git"
            # Never echo the token, even if git put it in the message.
            sed -E 's#(x-access-token:)[^@]+@#\1***@#g' /tmp/clone.err || true
            echo "::notice::GitHub only creates the wiki repository after the first page is made in the web UI. If the wiki has never had a page, open https://github.com/${REPOSITORY}/wiki and create one, then re-run."
            exit 1
          fi

      - name: Copy pages, commit and push
        if: steps.assemble.outputs.pages != '0'
        env:
          MESSAGE: ${{ steps.assemble.outputs.message }}
        run: |
          set -euo pipefail
          cp /tmp/wiki-pages/*.md /tmp/wiki/

          cd /tmp/wiki

          # Files that exist in the wiki but no longer have a source under
          # `wiki/` are removed, so deleting a file deletes the page. The
          # repository's own entry point is never removed.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            while IFS= read -r -d '' existing; do
              base="$(basename "$existing" .md)"
              [ "$base" = "Home" ] && continue
              if ! grep -Fxq "$base" /tmp/wiki-pages.manifest 2>/dev/null; then
                echo "removing page with no source: $base"
                rm -f "$existing"
              fi
            done < <(find . -maxdepth 1 -type f -name '*.md' -print0)
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all
          if git diff --cached --quiet; then
            echo "Wiki already up to date; nothing to commit."
            exit 0
          fi

          git commit -m "$MESSAGE"
          # Wikis are checked out on `master`; push whatever HEAD points at.
          git push origin HEAD

      - name: Summary
        if: always()
        run: |
          {
            echo "### Wiki publish"
            echo
            if [ -d /tmp/wiki-pages ] && [ -n "$(find /tmp/wiki-pages -type f -name '*.md' -print -quit)" ]; then
              echo "Pages published:"
              echo
              find /tmp/wiki-pages -type f -name '*.md' -printf '- `%f`\n' | sort
            else
              echo "No pages were staged."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
